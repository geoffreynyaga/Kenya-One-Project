[package]
name = "kenya-one"
version = "0.1.0"
description = "Kenya One aircraft design"
authors = ["Geoffrey Nyaga Kinyua"]
edition = "2021"
rust-version = "1.77.2"

# The binary is a thin wrapper so the shell can also be exercised from tests.
[lib]
name = "kenya_one_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
